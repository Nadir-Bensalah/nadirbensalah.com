<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #ffffff;
        font-family: Inter, system-ui, sans-serif;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        overflow: hidden;
      }
      .marque {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 600;
      }
      .pastille {
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 19px;
      }
      h1 {
        font-size: 66px;
        line-height: 1.04;
        letter-spacing: -0.03em;
        font-weight: 700;
        max-width: 960px;
      }
      .sous {
        font-size: 26px;
        line-height: 1.45;
        color: #615d59;
        margin-top: 22px;
        max-width: 820px;
      }
      .icones {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .icones img {
        width: 76px;
        height: 76px;
        border-radius: 17px;
        border: 1px solid rgba(0, 0, 0, 0.09);
        display: block;
      }
      .bas {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
      }
      .lieu {
        font-size: 20px;
        color: #726c66;
        white-space: nowrap;
        padding-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="marque"><span class="pastille">N</span>Nadir Ben Salah</div>

    <div>
      <h1 id="titre">Vous cherchez un développeur.<br />Voici ce que j’ai déjà construit.</h1>
      <p class="sous" id="sous">
        Huit applications conçues, développées et publiées sur l’App&nbsp;Store.
      </p>
    </div>

    <div class="bas">
      <div class="icones">
        <img src="../public/assets/apps/ticket.webp" alt="" />
        <img src="../public/assets/apps/pilou.webp" alt="" />
        <img src="../public/assets/apps/bus-amiens.webp" alt="" />
        <img src="../public/assets/apps/cocomind.webp" alt="" />
        <img src="../public/assets/apps/qindil.webp" alt="" />
        <img src="../public/assets/apps/isogonic.webp" alt="" />
        <img src="../public/assets/apps/forgeme.webp" alt="" />
        <img src="../public/assets/apps/ose.webp" alt="" />
      </div>
      <div class="lieu">Amiens · React Native · iOS &amp; Android</div>
    </div>
  </body>
</html>
